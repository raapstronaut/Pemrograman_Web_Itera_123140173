<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Mandiri</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="container">
        <h1>Latihan Javascript Dasar</h1>
        <p>Kumpulan latihan mandiri pertemuan 01</p>

      <section>
        <h2>Latihan 1 - Biodata Sendiri</h2>
            <div id="biodata-output" class="output"></div>
      </section>

      <section class="exercise-box">
        <h2>Latihan 2 - Cek Tahun Kabisat</h2>
            <label for="tahun">Masukkan Tahun</label>
            <input type="number" id="tahun" placeholder="Contoh: 2024">
            <button id="btn-kabisat">Cek Tahun</button>
            <div id="kabisat-output" class="output"></div>
        </section>

      <section class="exercise-box">
        <h2>Latihan 3 - Tabel Perkalian 1-5</h2>
            <div id="perkalian-output" class="output"></div>
      </section>

      <section class="exercise-box">
        <h2>Latihan 4 - Nilai Tertinggi dan Terendah</h2>
            <div id="nilai-output" class="output"></div>
      </section>

      <section class="exercise-box">
        <h2>Latihan 5 - Ambil Data User</h2>
            <button id="btn-user">Ambil Data User</button>
            <div id="user-output" class="output"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
