<svg xmlns="http://www.w3.org/2000/svg"
     width="500"
     height="360"
     viewBox="0 0 500 360"
     fill="none">

  <defs>
    <linearGradient id="planet"
      x1="225" y1="72" x2="421" y2="286"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#95B8FF"/>
      <stop offset=".48" stop-color="#6374D8"/>
      <stop offset="1" stop-color="#343B8D"/>
    </linearGradient>

    <linearGradient id="visor"
      x1="245" y1="75" x2="330" y2="155"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5F0FF"/>
      <stop offset=".35" stop-color="#58BDEB"/>
      <stop offset="1" stop-color="#20396E"/>
    </linearGradient>

    <linearGradient id="suit"
      x1="253" y1="155" x2="348" y2="290"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C1D3F0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <!-- Cahaya planet -->
  <circle cx="315" cy="178" r="124"
    fill="#779AFF" opacity=".10"/>

  <circle cx="315" cy="178" r="108"
    fill="#779AFF" opacity=".07"/>

  <!-- Bintang -->
  <circle cx="78" cy="64" r="3" fill="#B5EAFF"/>
  <circle cx="115" cy="251" r="2" fill="#FFFFFF"/>
  <circle cx="437" cy="55" r="3" fill="#C0BCFF"/>
  <circle cx="454" cy="254" r="2.5" fill="#B5EAFF"/>
  <circle cx="171" cy="75" r="2" fill="#FFFFFF"/>
  <circle cx="74" cy="181" r="2" fill="#A5CBFF"/>

  <path d="M129 36V52M121 44H137"
    stroke="#C5E8FF" stroke-width="2"
    stroke-linecap="round"/>

  <path d="M437 138V156M428 147H446"
    stroke="#C5C3FF" stroke-width="2"
    stroke-linecap="round"/>

  <!-- Planet -->
  <circle cx="315" cy="178" r="93"
    fill="url(#planet)"/>

  <path d="M240 126C275 146 322 109 363 135"
    stroke="#E0D6FF" stroke-width="12"
    stroke-linecap="round" opacity=".15"/>

  <path d="M252 211C291 190 338 222 382 205"
    stroke="#C9D3FF" stroke-width="15"
    stroke-linecap="round" opacity=".15"/>

  <circle cx="359" cy="127" r="19"
    fill="#282E79" opacity=".20"/>

  <circle cx="267" cy="211" r="13"
    fill="#232C73" opacity=".20"/>

  <!-- Cincin planet -->
  <ellipse cx="315" cy="178"
    rx="160" ry="49"
    transform="rotate(-21 315 178)"
    stroke="#BDD2FF"
    stroke-width="8"
    opacity=".55"/>

  <ellipse cx="315" cy="178"
    rx="172" ry="59"
    transform="rotate(-21 315 178)"
    stroke="#9EBCFF"
    stroke-width="1.5"
    opacity=".35"/>

  <!-- Astronaut -->
  <g transform="rotate(11 292 174)">

    <!-- Ransel -->
    <rect x="240" y="160"
      width="109" height="88"
      rx="25"
      fill="#849BC5"/>

    <!-- Kaki kiri -->
    <rect x="266" y="224"
      width="30" height="62"
      rx="13"
      fill="#E6EFFF"
      stroke="#A7BCDD"
      stroke-width="3"/>

    <!-- Kaki kanan -->
    <rect x="308" y="224"
      width="30" height="62"
      rx="13"
      fill="#E6EFFF"
      stroke="#A7BCDD"
      stroke-width="3"/>

    <!-- Sepatu -->
    <rect x="265" y="274"
      width="33" height="19"
      rx="9"
      fill="#425D94"/>

    <rect x="307" y="274"
      width="33" height="19"
      rx="9"
      fill="#425D94"/>

    <!-- Lengan kiri -->
    <rect x="225" y="166"
      width="34" height="75"
      rx="17"
      transform="rotate(18 225 166)"
      fill="#E7EFFF"
      stroke="#ADC0DF"
      stroke-width="3"/>

    <!-- Lengan kanan -->
    <rect x="342" y="163"
      width="34" height="75"
      rx="17"
      transform="rotate(-25 342 163)"
      fill="#E7EFFF"
      stroke="#ADC0DF"
      stroke-width="3"/>

    <!-- Sarung tangan -->
    <circle cx="245" cy="231" r="17"
      fill="#A7BCE0"/>

    <circle cx="365" cy="216" r="17"
      fill="#A7BCE0"/>

    <!-- Badan -->
    <rect x="257" y="153"
      width="91" height="99"
      rx="28"
      fill="url(#suit)"
      stroke="#B0C4E5"
      stroke-width="3"/>

    <!-- Panel astronaut -->
    <rect x="280" y="193"
      width="44" height="31"
      rx="8"
      fill="#8EA6CF"/>

    <rect x="288" y="201"
      width="27" height="8"
      rx="3"
      fill="#203967"/>

    <circle cx="291" cy="216" r="3.4"
      fill="#58E0BF"/>

    <circle cx="306" cy="216" r="3.4"
      fill="#9D9AFF"/>

    <!-- Leher helm -->
    <rect x="274" y="149"
      width="56" height="19"
      rx="8"
      fill="#A6BDE0"/>

    <!-- Helm -->
    <circle cx="302" cy="119"
      r="54"
      fill="#F3F7FF"
      stroke="#BED0EA"
      stroke-width="4"/>

    <!-- Kaca helm -->
    <rect x="261" y="93"
      width="82" height="63"
      rx="29"
      fill="url(#visor)"/>

    <!-- Pantulan kaca -->
    <path d="M275 112C283 98 300 98 312 100"
      stroke="#E0FFFF"
      stroke-width="7"
      stroke-linecap="round"
      opacity=".75"/>

    <path d="M270 147C291 161 320 159 337 146"
      stroke="#ADC3E6"
      stroke-width="3"
      stroke-linecap="round"/>

  </g>

  <!-- Bintang dekat astronaut -->
  <circle cx="201" cy="95" r="6"
    fill="#7DE4FF" opacity=".65"/>

  <circle cx="414" cy="303" r="5"
    fill="#9C9BFF" opacity=".7"/>

</svg>